<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 40" width="100%" height="40" preserveAspectRatio="none">
  <defs>
    <pattern id="africanMosaic" width="80" height="40" patternUnits="userSpaceOnUse">
      <!-- Background Soft Cream Base -->
      <rect width="80" height="40" fill="#EFEBD1" />
      
      <!-- Top/Bottom Healing Teal Border Accents -->
      <rect x="0" y="0" width="80" height="2" fill="#62C4B4" />
      <rect x="0" y="38" width="80" height="2" fill="#62C4B4" />

      <!-- Diamond Mosaic Unit 1 (0 to 40) -->
      <!-- Outer Peace Orange Diamond -->
      <polygon points="20,3 37,20 20,37 3,20" fill="#EF5C2C" />
      <!-- Middle Ancestral Gold Diamond -->
      <polygon points="20,7 33,20 20,33 7,20" fill="#F7B24A" />
      <!-- Inner Healing Teal Diamond -->
      <polygon points="20,11 29,20 20,29 11,20" fill="#62C4B4" />
      <!-- Center Soft Cream Core -->
      <circle cx="20" cy="20" r="3.5" fill="#EFEBD1" />

      <!-- Side Triangle Chevrons Left (Leaf Green & Deep Earth) -->
      <polygon points="0,3 8,11 0,19" fill="#6AAD7C" />
      <polygon points="0,21 8,29 0,37" fill="#B3340F" />

      <!-- Side Triangle Chevrons Right (Deep Earth & Leaf Green) -->
      <polygon points="40,3 32,11 40,19" fill="#B3340F" />
      <polygon points="40,21 32,29 40,37" fill="#6AAD7C" />

      <!-- Top & Bottom Accent Chevrons -->
      <polygon points="12,0 20,6 28,0" fill="#62C4B4" />
      <polygon points="12,40 20,34 28,40" fill="#62C4B4" />

      <!-- Diamond Mosaic Unit 2 (40 to 80) -->
      <!-- Outer Healing Teal Diamond -->
      <polygon points="60,3 77,20 60,37 43,20" fill="#62C4B4" />
      <!-- Middle Peace Orange Diamond -->
      <polygon points="60,7 73,20 60,33 47,20" fill="#EF5C2C" />
      <!-- Inner Ancestral Gold Diamond -->
      <polygon points="60,11 69,20 60,29 51,20" fill="#F7B24A" />
      <!-- Center Leaf Green Core -->
      <circle cx="60" cy="20" r="3.5" fill="#6AAD7C" />

      <!-- Chevrons Left (Peace Orange / Ancestral Gold) -->
      <polygon points="40,3 48,11 40,19" fill="#EF5C2C" />
      <polygon points="40,21 48,29 40,37" fill="#F7B24A" />

      <!-- Chevrons Right (Ancestral Gold / Peace Orange) -->
      <polygon points="80,3 72,11 80,19" fill="#F7B24A" />
      <polygon points="80,21 72,29 80,37" fill="#EF5C2C" />

      <!-- Top & Bottom Deep Earth Accents -->
      <polygon points="52,0 60,6 68,0" fill="#B3340F" />
      <polygon points="52,40 60,34 68,40" fill="#B3340F" />
    </pattern>
  </defs>
  <rect width="100%" height="40" fill="url(#africanMosaic)" />
</svg>