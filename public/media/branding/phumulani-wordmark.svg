<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="100%">
  <defs>
    <linearGradient id="wmSun" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D67C35" />
      <stop offset="100%" stop-color="#F9A825" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(40, 20)">
