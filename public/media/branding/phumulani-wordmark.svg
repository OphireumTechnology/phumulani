    <circle cx="70" cy="55" r="28" fill="url(#wmSun)" />
    <!-- Embrace Figures -->
    <circle cx="70" cy="50" r="10" fill="#FFFFFF" />
    <circle cx="53" cy="58" r="8" fill="#E8F3F1" />
    <circle cx="87" cy="58" r="8" fill="#E8F3F1" />
    <path d="M42 98 C46 72 60 65 70 65 C80 65 94 72 98 98 C88 105 52 105 42 98 Z" fill="#FFFFFF" />
    <path d="M28 112 C50 100 90 100 112 112 C98 122 42 122 28 112 Z" fill="#D67C35" />
  </g>

  <!-- Typography Right -->
  <g transform="translate(200, 30)">
