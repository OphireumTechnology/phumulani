<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bookSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B373D" />
      <stop offset="40%" stop-color="#104F57" />
      <stop offset="70%" stop-color="#633C69" />
      <stop offset="100%" stop-color="#D67C35" />
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2D30" />
      <stop offset="100%" stop-color="#0E191B" />
    </linearGradient>
    <linearGradient id="goldTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
  </defs>

  <!-- Book Cover Canvas -->
  <rect width="600" height="900" fill="url(#bookSky)" />

  <!-- Radiating Sunrise / Breaking Dawn Behind Mountains -->
  <circle cx="300" cy="550" r="160" fill="#FFB74D" opacity="0.6" />
  <circle cx="300" cy="550" r="120" fill="#FFE082" opacity="0.8" />
  <circle cx="300" cy="550" r="80" fill="#FFF8E1" />

  <!-- Mountain Silhouettes (The "Giants" of Fear, Isolation, Trauma) -->
  <!-- Distant Range -->
  <polygon points="-50,650 180,480 380,680" fill="#254247" opacity="0.8" />
  <polygon points="220,680 440,460 650,680" fill="#3D2942" opacity="0.8" />
  <!-- Forefront Mighty Mountain Peak -->
  <polygon points="-100,900 120,530 400,900" fill="url(#mountain1)" />
  <polygon points="180,900 480,510 700,900" fill="url(#mountain1)" />
  <!-- Golden Path of Autonomy Leading to the Summit -->
  <path d="M300 900 Q 295 780 300 680 Q 305 600 300 540" fill="none" stroke="#FFE082" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Solitary Courageous Figure Standing at the Summit -->
  <g transform="translate(300, 520)">
    <circle cx="0" cy="-20" r="6" fill="#FFF8E1" />
    <path d="M-6 -10 L6 -10 L10 20 L-10 20 Z" fill="#FFF8E1" />
    <!-- Raised Hand of Freedom -->
    <path d="M4 -8 L16 -22" stroke="#FFF8E1" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Elegant Book Typography Layout -->
  <!-- Top Tagline -->
  <g transform="translate(300, 80)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFE082" letter-spacing="4" text-anchor="middle">
      A MEMOIR OF COURAGE, FAITH &amp; RESTORATION
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(300, 160)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="52" fill="url(#goldTitle)" text-anchor="middle" letter-spacing="2">
      FACING THE
    </text>
    <text x="0" y="65" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="74" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
      GIANTS
    </text>
    <line x1="-140" y1="90" x2="140" y2="90" stroke="#D67C35" stroke-width="3" />
  </g>

  <!-- Subtitle -->
  <g transform="translate(300, 290)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="17" fill="#E8F3F1" text-anchor="middle" letter-spacing="1">
      A Journey to Freedom from Domestic Abuse
    </text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="400" font-size="13" fill="#D4E8E5" text-anchor="middle">
      and Reclaiming Dignity as an Immigrant Survivor
    </text>
  </g>

  <!-- Author Byline at Bottom -->
  <g transform="translate(300, 810)">
    <rect x="-180" y="-30" width="360" height="60" rx="8" fill="#104F57" stroke="#D67C35" stroke-width="1.5" />
    <text x="0" y="-4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFD54F" letter-spacing="3" text-anchor="middle">
      BY ACCLAIMED FOUNDER &amp; ADVOCATE
    </text>
    <text x="0" y="18" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">
      COMFORT DONDO
    </text>
  </g>
</svg>
