<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="houseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F3F1" />
      <stop offset="100%" stop-color="#CDE3DF" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#houseBg)" />
  <circle cx="400" cy="280" r="230" fill="#FFFFFF" stroke="#104F57" stroke-width="2" />

  <!-- Peaceful Healing Home Silhouette -->
  <g transform="translate(400, 260)">
    <!-- House Foundation & Walls -->
    <rect x="-140" y="-30" width="280" height="180" rx="10" fill="#104F57" />
    <!-- Roof with Shelter Peak -->
    <polygon points="-160,-25 0,-160 160,-25" fill="#633C69" />
    <!-- Chimney of Warmth -->
    <rect x="70" y="-130" width="30" height="50" fill="#D67C35" />
    <!-- Friendly Glowing Sunlit Doorway -->
    <path d="M-35 150 L-35 50 Q 0 25 35 50 L35 150 Z" fill="#FFD54F" />
    <!-- Golden Key of Autonomy & Safe Housing Lease -->
    <circle cx="0" cy="80" r="16" fill="none" stroke="#D67C35" stroke-width="5" />
    <path d="M0 96 L0 125 M0 110 L12 110 M0 120 L8 120" stroke="#D67C35" stroke-width="5" stroke-linecap="round" />
    <!-- Sunlit Window Panes -->
    <rect x="-110" y="20" width="50" height="50" rx="6" fill="#FFF9C4" stroke="#FFFFFF" stroke-width="3" />
    <rect x="60" y="20" width="50" height="50" rx="6" fill="#FFF9C4" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- Tagline Banner -->
  <rect x="150" y="500" width="500" height="50" rx="10" fill="#104F57" />
  <text x="400" y="531" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    HOUSING STABILITY · TRANSITIONAL HEALING HOMES
  </text>
</svg>
