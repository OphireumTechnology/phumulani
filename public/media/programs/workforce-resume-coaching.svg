<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F9FA" />
      <stop offset="100%" stop-color="#E8F3F1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wfBg)" />
  <circle cx="400" cy="280" r="230" fill="#FFFFFF" stroke="#104F57" stroke-width="2" />

  <!-- Career Coaching & Laptop Workspace -->
  <g transform="translate(400, 270)">
    <!-- Desk Line -->
    <rect x="-180" y="80" width="360" height="15" rx="4" fill="#263238" />
    <!-- Modern Laptop with Resume / Job Opportunity Open -->
    <rect x="-90" y="-30" width="180" height="110" rx="8" fill="#104F57" />
    <rect x="-80" y="-20" width="160" height="90" rx="4" fill="#FFFFFF" />
    <!-- Document Lines on Screen -->
    <rect x="-65" y="-10" width="80" height="8" rx="2" fill="#D67C35" />
    <rect x="-65" y="5" width="130" height="4" rx="2" fill="#B0BEC5" />
    <rect x="-65" y="15" width="120" height="4" rx="2" fill="#B0BEC5" />
    <rect x="-65" y="25" width="100" height="4" rx="2" fill="#B0BEC5" />
    <rect x="-65" y="40" width="50" height="15" rx="3" fill="#633C69" />
    <!-- Laptop Base -->
    <polygon points="-110,80 110,80 90,88 -90,88" fill="#37474F" />

    <!-- Professional Coaching Notes & Target Growth Icon -->
    <g transform="translate(-130, -50)">
      <rect x="0" y="0" width="60" height="80" rx="4" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2" />
      <line x1="10" y1="20" x2="50" y2="20" stroke="#F57F17" stroke-width="2" />
      <line x1="10" y1="35" x2="45" y2="35" stroke="#F57F17" stroke-width="2" />
      <line x1="10" y1="50" x2="50" y2="50" stroke="#F57F17" stroke-width="2" />
      <circle cx="30" cy="65" r="5" fill="#388E3C" />
    </g>

    <!-- Upward Career Mobility Arrow -->
    <g transform="translate(130, -40)">
      <circle cx="20" cy="20" r="35" fill="#E8F3F1" stroke="#104F57" stroke-width="2" />
      <path d="M5 35 L30 10 M30 10 L15 10 M30 10 L30 25" fill="none" stroke="#D67C35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Tagline Banner -->
  <rect x="150" y="500" width="500" height="50" rx="10" fill="#104F57" />
  <text x="400" y="531" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    WORKFORCE READINESS · BILINGUAL CAREER PATHWAYS
  </text>
</svg>
