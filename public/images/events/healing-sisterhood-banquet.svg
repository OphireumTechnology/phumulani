<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="galaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#104F57" />
      <stop offset="60%" stop-color="#1F2A38" />
      <stop offset="100%" stop-color="#633C69" />
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#galaBg)" />

  <!-- Hanging Lanterns & Twinkle Lights -->
  <g opacity="0.8">
    <circle cx="200" cy="140" r="80" fill="url(#lanternGlow)" />
    <circle cx="200" cy="140" r="16" fill="#FFF9C4" />
    <line x1="200" y1="0" x2="200" y2="140" stroke="#FFD54F" stroke-width="2" />

    <circle cx="600" cy="100" r="100" fill="url(#lanternGlow)" />
    <circle cx="600" cy="100" r="22" fill="#FFF9C4" />
    <line x1="600" y1="0" x2="600" y2="100" stroke="#FFD54F" stroke-width="2" />

    <circle cx="1000" cy="140" r="80" fill="url(#lanternGlow)" />
    <circle cx="1000" cy="140" r="16" fill="#FFF9C4" />
    <line x1="1000" y1="0" x2="1000" y2="140" stroke="#FFD54F" stroke-width="2" />
  </g>

  <!-- Elegant Banquet Stage & Center Floral Installation -->
  <ellipse cx="600" cy="650" rx="480" ry="140" fill="#263238" stroke="#D67C35" stroke-width="3" />
  <ellipse cx="600" cy="640" rx="420" ry="120" fill="#FFFFFF" />

  <!-- Banquet Table Linens, Table Numbers, Glasses -->
  <g transform="translate(600, 600)">
    <!-- Center Floral Arrangement of Hibiscus & Protea -->
    <path d="M-40 0 C-40 -60 40 -60 40 0 Z" fill="#D67C35" />
    <circle cx="0" cy="-60" r="25" fill="#C2185B" />
    <circle cx="-25" cy="-45" r="18" fill="#F06292" />
    <circle cx="25" cy="-45" r="18" fill="#F06292" />
    <!-- Table Candles -->
    <rect x="-80" y="-20" width="10" height="25" fill="#FFE082" />
    <circle cx="-75" cy="-28" r="6" fill="#FFB300" />
    <rect x="70" y="-20" width="10" height="25" fill="#FFE082" />
    <circle cx="75" cy="-28" r="6" fill="#FFB300" />
  </g>

  <!-- Banner -->
  <g transform="translate(300, 240)">
    <rect width="600" height="90" rx="16" fill="#104F57" opacity="0.95" stroke="#FFE082" stroke-width="2" />
    <text x="300" y="40" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle">
      Annual Healing &amp; Sisterhood Banquet
    </text>
    <text x="300" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFD54F" letter-spacing="3" text-anchor="middle">
      CELEBRATING SURVIVOR RESILIENCE &amp; SISTERHOOD
    </text>
  </g>
</svg>
