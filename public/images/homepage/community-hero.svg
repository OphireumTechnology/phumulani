<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="100%" height="100%">
  <defs>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F3F1" />
      <stop offset="60%" stop-color="#F7F9FA" />
      <stop offset="100%" stop-color="#FDF1E8" />
    </linearGradient>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D67C35" />
      <stop offset="100%" stop-color="#B2652B" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1400" height="850" fill="url(#heroSky)" />

  <!-- Sunlit Arch Windows & Warm Community Architecture -->
  <g opacity="0.4">
    <path d="M150 100 Q 250 20 350 100 L350 480 L150 480 Z" fill="#FFFFFF" stroke="#C3DCD7" stroke-width="4" />
    <path d="M550 80 Q 700 0 850 80 L850 480 L550 480 Z" fill="#FFFFFF" stroke="#C3DCD7" stroke-width="4" />
    <path d="M1050 100 Q 1150 20 1250 100 L1250 480 L1050 480 Z" fill="#FFFFFF" stroke="#C3DCD7" stroke-width="4" />
  </g>

  <!-- Golden Sunbeams -->
  <path d="M700 40 L400 850 L1000 850 Z" fill="#FFF8E1" opacity="0.45" />

  <!-- Botanical Elements of Growth & Rest -->
  <g fill="#104F57" opacity="0.25">
    <ellipse cx="120" cy="550" rx="40" ry="120" transform="rotate(-20 120 550)" />
    <ellipse cx="1280" cy="550" rx="40" ry="120" transform="rotate(20 1280 550)" />
  </g>

  <!-- Circular Community Sisterhood Hearth Rug -->
  <ellipse cx="700" cy="650" rx="550" ry="160" fill="#104F57" opacity="0.9" />
  <ellipse cx="700" cy="650" rx="520" ry="145" fill="none" stroke="#D67C35" stroke-width="4" stroke-dasharray="14 10" />

  <!-- Welcoming Centerpiece with Spiced Spices, Hibiscus Tea & Fresh Breads -->
  <ellipse cx="700" cy="630" rx="140" ry="45" fill="#D67C35" />
  <circle cx="700" cy="620" r="18" fill="#F9A825" />
  <circle cx="650" cy="625" r="12" fill="#FFFFFF" stroke="#104F57" stroke-width="2" />
  <circle cx="750" cy="625" r="12" fill="#FFFFFF" stroke="#104F57" stroke-width="2" />

  <!-- Women Figures in Unified Circle of Belonging -->
  <!-- Left Figure: Somali Advocate -->
  <g transform="translate(320, 500)">
    <path d="M0 180 C20 80 80 80 100 180 Z" fill="#D67C35" />
    <circle cx="50" cy="45" r="32" fill="#502B13" />
    <path d="M18 45 C18 10 82 10 82 45 C82 90 70 100 50 100 C30 100 18 90 18 45 Z" fill="#104F57" />
  </g>

  <!-- Left-Center Figure: Young Mother Rebuilding -->
  <g transform="translate(480, 520)">
    <path d="M0 160 C20 70 70 70 90 160 Z" fill="#633C69" />
    <circle cx="45" cy="42" r="28" fill="#653B1D" />
    <path d="M18 40 C18 15 72 15 72 40 C72 80 62 90 45 90 C28 90 18 80 18 40 Z" fill="#E8F3F1" />
  </g>

  <!-- Center Figure: Comfort Dondo Facilitating -->
  <g transform="translate(640, 460)">
    <path d="M0 220 C25 90 100 90 120 220 Z" fill="#104F57" />
    <path d="M25 110 C45 150 75 150 95 110 L110 220 L10 220 Z" fill="#D67C35" />
    <circle cx="60" cy="45" r="34" fill="#633C69" />
    <circle cx="60" cy="50" r="26" fill="#553019" />
    <!-- Welcoming Arms -->
    <path d="M5 130 Q -25 110 -15 90" fill="none" stroke="#553019" stroke-width="8" stroke-linecap="round" />
    <path d="M115 130 Q 145 110 135 90" fill="none" stroke="#553019" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Right-Center Figure: Youth Leadership Mentee -->
  <g transform="translate(820, 520)">
    <path d="M0 160 C20 70 70 70 90 160 Z" fill="#205B63" />
    <circle cx="45" cy="42" r="28" fill="#502B13" />
    <path d="M18 40 C18 15 72 15 72 40 C72 80 62 90 45 90 C28 90 18 80 18 40 Z" fill="#FFE082" />
  </g>

  <!-- Right Figure: Oromo Community Sister -->
  <g transform="translate(980, 500)">
    <path d="M0 180 C20 80 80 80 100 180 Z" fill="#633C69" />
    <circle cx="50" cy="45" r="32" fill="#3E1E09" />
    <path d="M18 45 C18 10 82 10 82 45 C82 90 70 100 50 100 C30 100 18 90 18 45 Z" fill="#D67C35" />
  </g>

  <!-- Community Banner Plaque -->
  <g transform="translate(350, 750)">
    <rect width="700" height="60" rx="12" fill="#FFFFFF" stroke="#C3DCD7" stroke-width="2" />
    <text x="350" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#104F57" text-anchor="middle">
      AUTHENTIC SISTERHOOD · SAFE REFUGE · DIGNITY IN EVERY JOURNEY
    </text>
  </g>
</svg>
