<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="entBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1E8" />
      <stop offset="100%" stop-color="#E8F3F1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#entBg)" />
  <circle cx="400" cy="280" r="230" fill="#FFFFFF" stroke="#D67C35" stroke-width="2" />

  <!-- Immigrant Women Storefront & Micro-Enterprise Growth -->
  <g transform="translate(400, 270)">
    <!-- Storefront Canopy Awning -->
    <path d="M-130 -60 L130 -60 L110 -15 L-110 -15 Z" fill="#D67C35" />
    <path d="M-130 -15 Q -105 0 -80 -15 Q -55 0 -30 -15 Q -5 0 20 -15 Q 45 0 70 -15 Q 95 0 120 -15" fill="#B2652B" />
    <!-- Shop Structure -->
    <rect x="-110" y="-15" width="220" height="130" fill="#104F57" rx="4" />
    <!-- Display Window -->
    <rect x="-95" y="0" width="90" height="90" rx="4" fill="#E8F3F1" />
    <!-- Artisan Handcrafted Goods on Display -->
    <circle cx="-50" cy="45" r="22" fill="#633C69" />
    <circle cx="-50" cy="45" r="14" fill="#FFD54F" />
    <!-- Business Entrance -->
    <rect x="15" y="0" width="80" height="115" rx="4" fill="#FFFFFF" />
    <!-- "OPEN" / Minnesota LLC Certificate Sign -->
    <rect x="30" y="25" width="50" height="30" rx="3" fill="#D67C35" />
    <text x="55" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle">
      LLC
    </text>

    <!-- Seed Capital Micro-grant Coin -->
    <g transform="translate(90, -80)">
      <circle cx="20" cy="20" r="30" fill="#FFD54F" stroke="#F57F17" stroke-width="3" />
      <text x="20" y="28" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" fill="#E65100" text-anchor="middle">
        $
      </text>
    </g>
  </g>

  <!-- Tagline Banner -->
  <rect x="150" y="500" width="500" height="50" rx="10" fill="#104F57" />
  <text x="400" y="531" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    IMMIGRANT WOMEN ENTREPRENEURSHIP · SEED MICRO-GRANTS
  </text>
</svg>
