<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 40" width="100%" height="40" preserveAspectRatio="none">
  <defs>
    <pattern id="africanMosaic" width="80" height="40" patternUnits="userSpaceOnUse">
      <!-- Background Soft Cream Base -->
      <rect width="80" height="40" fill="#F7F3E0" />
      
      <!-- Top/Bottom Healing Teal Border Accents -->
      <rect x="0" y="0" width="80" height="2" fill="#60C3B4" />
      <rect x="0" y="38" width="80" height="2" fill="#60C3B4" />

      <!-- Diamond Mosaic Unit 1 (0 to 40) -->
      <!-- Outer Sunrise Orange Diamond -->
      <polygon points="20,3 37,20 20,37 3,20" fill="#F97316" />
      <!-- Middle Sunshine Gold Diamond -->
      <polygon points="20,7 33,20 20,33 7,20" fill="#F7B733" />
      <!-- Inner Healing Teal Diamond -->
      <polygon points="20,11 29,20 20,29 11,20" fill="#60C3B4" />
      <!-- Center Soft Cream Core -->
      <circle cx="20" cy="20" r="3.5" fill="#F7F3E0" />

      <!-- Side Triangle Chevrons Left (Life Green & Deep Earth) -->
      <polygon points="0,3 8,11 0,19" fill="#4CAF7C" />
      <polygon points="0,21 8,29 0,37" fill="#A63C14" />

      <!-- Side Triangle Chevrons Right (Deep Earth & Life Green) -->
      <polygon points="40,3 32,11 40,19" fill="#A63C14" />
      <polygon points="40,21 32,29 40,37" fill="#4CAF7C" />

      <!-- Top & Bottom Accent Chevrons -->
      <polygon points="12,0 20,6 28,0" fill="#60C3B4" />
      <polygon points="12,40 20,34 28,40" fill="#60C3B4" />

      <!-- Diamond Mosaic Unit 2 (40 to 80) -->
      <!-- Outer Healing Teal Diamond -->
      <polygon points="60,3 77,20 60,37 43,20" fill="#60C3B4" />
      <!-- Middle Sunrise Orange Diamond -->
      <polygon points="60,7 73,20 60,33 47,20" fill="#F97316" />
      <!-- Inner Sunshine Gold Diamond -->
      <polygon points="60,11 69,20 60,29 51,20" fill="#F7B733" />
      <!-- Center Life Green Core -->
      <circle cx="60" cy="20" r="3.5" fill="#4CAF7C" />

      <!-- Chevrons Left (Sunrise Orange / Sunshine Gold) -->
      <polygon points="40,3 48,11 40,19" fill="#F97316" />
      <polygon points="40,21 48,29 40,37" fill="#F7B733" />

      <!-- Chevrons Right (Sunshine Gold / Sunrise Orange) -->
      <polygon points="80,3 72,11 80,19" fill="#F7B733" />
      <polygon points="80,21 72,29 80,37" fill="#F97316" />

      <!-- Top & Bottom Deep Earth Accents -->
      <polygon points="52,0 60,6 68,0" fill="#A63C14" />
      <polygon points="52,40 60,34 68,40" fill="#A63C14" />
    </pattern>
  </defs>
  <rect width="100%" height="40" fill="url(#africanMosaic)" />
</svg>