name: Playwright End-to-End Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-e2e:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      PHUMULANI_OPERATIONAL_MODE: STAGED_DEVELOPMENT
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Temporary bootstrap until a genuine npm lockfile is committed.
      # Do not use npm ci or setup-node npm caching without package-lock.json.
      - name: Install dependencies (lockfile bootstrap)
        run: npm install --no-audit --no-fund

      - name: Verify TypeScript and build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Discover Playwright tests
        run: npx playwright test --list

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests (Chromium)
        run: npx playwright test --project=chromium

      - name: Upload Playwright results and traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
