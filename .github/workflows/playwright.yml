name: Phumulani Comprehensive CI & Browser Verification Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI STAGES 1 - 4: DEPENDENCIES, TYPESCRIPT, BUILD & REGRESSION
  verify-and-build:
    name: "CI Stages 1-4: Verify, Build & Regression Suite"
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      PHUMULANI_OPERATIONAL_MODE: STAGED_DEVELOPMENT
      CI: 'true'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Guard required npm lockfile before Node setup
        shell: bash
        run: |
          if [ ! -s package-lock.json ]; then
            echo "::error file=package-lock.json::Required tracked npm lockfile is missing. Google AI Studio sync must preserve package-lock.json; restore it from the last passing commit."
            exit 1
          fi
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "::error file=package-lock.json::package-lock.json must be tracked in Git."
            exit 1
          fi
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));if(!p.lockfileVersion||!p.packages)process.exit(1)"
          echo "Required tracked npm lockfile is present and structurally valid."

      - name: Setup Node.js Runtime (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # CI Stage 1 — Dependency verification
      - name: CI Stage 1 — Dependency Verification
        run: |
          echo "=== CI STAGE 1: RUNTIME & DEPENDENCY VERIFICATION ==="
          node --version
          npm --version
          npm ci --no-audit --no-fund

      # CI Stage 2 — TypeScript verification
      - name: CI Stage 2 — TypeScript Verification
        run: |
          echo "=== CI STAGE 2: TYPESCRIPT TYPE-CHECKING ==="
          npx tsc --noEmit

      # CI Stage 3 — Application build
      - name: CI Stage 3 — Application Build
        run: |
          echo "=== CI STAGE 3: APPLICATION BUNDLE BUILD ==="
          npm run build

      # CI Stage 4 — Full regression suite (688 tests)
      - name: CI Stage 4 — Full Regression Suite & Persistence Integrity
        run: |
          echo "=== CI STAGE 4: AUTHORITATIVE REGRESSION SUITE (688 TESTS) ==="
          npx tsx scripts/verify_suite.ts

  # CI STAGES 5 - 9: BROWSER TEST DISCOVERY & CROSS-BROWSER MATRIX
  browser-tests:
    name: "CI Stages 5-9: Browser Execution (${{ matrix.project }})"
    needs: verify-and-build
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, 'Mobile Chrome']
    env:
      PHUMULANI_OPERATIONAL_MODE: STAGED_DEVELOPMENT
      CI: 'true'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Guard required npm lockfile before Node setup
        shell: bash
        run: |
          if [ ! -s package-lock.json ]; then
            echo "::error file=package-lock.json::Required tracked npm lockfile is missing. Google AI Studio sync must preserve package-lock.json; restore it from the last passing commit."
            exit 1
          fi
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "::error file=package-lock.json::package-lock.json must be tracked in Git."
            exit 1
          fi
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));if(!p.lockfileVersion||!p.packages)process.exit(1)"
          echo "Required tracked npm lockfile is present and structurally valid."

      - name: Setup Node.js Runtime (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # CI Stage 5 — Browser test discovery
      - name: CI Stage 5 — Browser Test Discovery
        run: |
          echo "=== CI STAGE 5: PLAYWRIGHT TEST DISCOVERY ==="
          npx playwright test --list

      # CI Stage 6 & 7 — Install Playwright browser binaries with OS deps
      - name: Install Playwright ${{ matrix.project }} Dependencies
        run: |
          echo "=== INSTALLING SYSTEM DEPS FOR ${{ matrix.project }} ==="
          if [ "${{ matrix.project }}" = "Mobile Chrome" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps ${{ matrix.project }}
          fi

      # CI Stage 6 & 7 — Execute project tests
      - name: Run Playwright E2E Tests (${{ matrix.project }})
        run: |
          echo "=== EXECUTING E2E TEST PROJECT: ${{ matrix.project }} ==="
          npx playwright test --project="${{ matrix.project }}"

      # CI Stage 9 — Preserve test artifacts
      - name: Upload Playwright Artifacts (${{ matrix.project }})
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-artifacts-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
